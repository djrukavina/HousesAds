name: Scrape listings

on:
  schedule:
    # Private free tier: 2,000 min/month. Two watches now scrape 40 area-scoped
    # URLs with Playwright, so every 2 h (~360 runs) stays under the cap.
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Python dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Install Playwright
        working-directory: scraper
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install chromium
          else
            python -m playwright install chromium --with-deps
          fi

      - name: Run scrape cycle
        working-directory: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_HIDE_TOPIC: ${{ secrets.NTFY_HIDE_TOPIC }}
          HOUSESADS_DB_PATH: ${{ github.workspace }}/data/monitor.sqlite3
          HOUSESADS_JSON_PATH: ${{ github.workspace }}/data/listings.json
          HOUSESADS_HIDDEN_PATH: ${{ github.workspace }}/data/hidden.json
          MAX_PAGES: "1"
          HEADLESS: "true"
          REQUEST_DELAY_SEC: "1.0"
        run: python run_monitor.py --once

      - name: Publish feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/hidden.json
          if [ -f data/monitor.sqlite3 ]; then
            git add data/monitor.sqlite3
          fi
          if git diff --staged --quiet; then
            echo "No listing changes"
            exit 0
          fi
          git commit -m "Update scraped listings"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              # Prefer this run's scraped artifacts over whatever landed on main mid-run
              # (rebase: --theirs = our commit being applied).
              git checkout --theirs -- data/listings.json data/hidden.json data/monitor.sqlite3 || true
              git add data/listings.json data/hidden.json data/monitor.sqlite3
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push failed, retrying ($attempt/5)..."
            sleep 3
          done
          if [ "$pushed" != true ]; then
            echo "Failed to publish feed after retries"
            exit 1
          fi

name: Scrape listings

on:
  schedule:
    # Privatni repo ima ~2000 min/mjesec. Playwright job traje par minuta,
    # pa je satni raspored sigurniji od svakih 15 min. Ručno: Actions → Run workflow.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Python dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Install Playwright
        working-directory: scraper
        run: python -m playwright install chromium --with-deps

      - name: Run scrape cycle
        working-directory: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOUSESADS_DB_PATH: ${{ github.workspace }}/data/monitor.sqlite3
          HOUSESADS_JSON_PATH: ${{ github.workspace }}/data/listings.json
          MAX_PAGES: "1"
          HEADLESS: "true"
          REQUEST_DELAY_SEC: "1.0"
        run: python run_monitor.py --once

      - name: Publish feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          if [ -f data/monitor.sqlite3 ]; then
            git add data/monitor.sqlite3
          fi
          if git diff --staged --quiet; then
            echo "No listing changes"
          else
            git commit -m "Update scraped listings"
            git push
          fi

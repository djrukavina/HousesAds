name: Scrape listings

on:
  schedule:
    # Private repos: 2,000 free Actions minutes/month — hourly keeps usage under the cap.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Python dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Install Playwright
        working-directory: scraper
        run: python -m playwright install chromium --with-deps

      - name: Run scrape cycle
        working-directory: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_HIDE_TOPIC: ${{ secrets.NTFY_HIDE_TOPIC }}
          HOUSESADS_DB_PATH: ${{ github.workspace }}/data/monitor.sqlite3
          HOUSESADS_JSON_PATH: ${{ github.workspace }}/data/listings.json
          HOUSESADS_HIDDEN_PATH: ${{ github.workspace }}/data/hidden.json
          MAX_PAGES: "1"
          HEADLESS: "true"
          REQUEST_DELAY_SEC: "1.0"
        run: python run_monitor.py --once

      - name: Publish feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/hidden.json
          if [ -f data/monitor.sqlite3 ]; then
            git add data/monitor.sqlite3
          fi
          if git diff --staged --quiet; then
            echo "No listing changes"
          else
            git commit -m "Update scraped listings"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              echo "Push failed, retrying ($attempt/5)..."
              sleep 2
            done
          fi
